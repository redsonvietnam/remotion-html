<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Bento Grid Showcase — Remotion-HTML Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{ --stage-w: 405px; --stage-h: 720px; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{
    background:#1a1a1a; min-height:100vh;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:18px; font-family:'Inter',sans-serif; color:#ddd; padding:30px 0;
  }

  #stage{
    position:relative; width:var(--stage-w); height:var(--stage-h);
    overflow:hidden; border-radius:22px; box-shadow:0 30px 90px rgba(0,0,0,.75);
    background:#06050a; color:#f5f4fa;
  }
  .scene{ position:absolute; inset:0; opacity:0; }

  #aurora{ position:absolute; inset:0; z-index:0; overflow:hidden; }
  .blob{ position:absolute; border-radius:50%; filter:blur(46px); mix-blend-mode:screen; opacity:.55; }
  #noise{ position:absolute; inset:0; z-index:1; background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.05'/></svg>"); mix-blend-mode:overlay; }

  /* ---- scene: hook (kinetic mask reveal) ---- */
  #scene-hook{ display:flex; flex-direction:column; align-items:center; justify-content:center; padding:0 30px; z-index:5; }
  .masklinewrap{ overflow:hidden; }
  .maskline{ font-weight:900; font-size:38px; line-height:1.18; letter-spacing:-1px; text-align:center; }
  #hookline2{ background:linear-gradient(90deg,#7c5cff,#ff6bd6,#3ddcff); -webkit-background-clip:text; background-clip:text; color:transparent; }

  /* ---- scene: bento grid ---- */
  #scene-bento{ padding:56px 16px 0; z-index:5; }
  #bentotitle{ text-align:center; font-size:11px; font-weight:700; letter-spacing:3px; color:rgba(245,244,250,.5); text-transform:uppercase; margin-bottom:14px; }
  #bentogrid{
    display:grid; grid-template-columns:repeat(4,1fr); grid-auto-rows:64px; gap:9px;
    position:relative;
  }
  .bcard{
    background:rgba(255,255,255,.055);
    -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px);
    border:1px solid rgba(255,255,255,.13);
    border-radius:18px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.12), 0 10px 24px rgba(0,0,0,.3);
    padding:12px 13px;
    position:relative; overflow:hidden;
    display:flex; flex-direction:column; justify-content:center;
  }
  #card-stat{ grid-column:1/3; grid-row:1/3; align-items:flex-start; }
  #card-stat .big{ font-weight:900; font-size:38px; letter-spacing:-1px; }
  #card-stat .lbl{ font-size:11px; color:rgba(245,244,250,.65); margin-top:4px; }

  #card-f1{ grid-column:3/5; grid-row:1/2; }
  #card-f1 .ic{ font-size:17px; } #card-f1 .t{ font-size:11.5px; font-weight:700; margin-top:4px; }

  #card-f2{ grid-column:3/4; grid-row:2/3; align-items:center; text-align:center; }
  #card-f2 .ic{ font-size:20px; }

  #card-chart{ grid-column:4/5; grid-row:2/3; }
  #card-chart svg{ width:100%; height:34px; }

  #card-quote{ grid-column:1/4; grid-row:3/4; justify-content:center; }
  #card-quote .q{ font-size:11.5px; font-style:italic; line-height:1.4; }
  #card-quote .a{ font-size:9.5px; color:rgba(245,244,250,.5); margin-top:4px; }

  #card-palette{ grid-column:4/5; grid-row:3/4; align-items:center; }
  #card-palette .swrow{ display:flex; gap:4px; }
  #card-palette .sw{ width:12px; height:12px; border-radius:4px; }

  /* ---- scene: outro ---- */
  #scene-outro{ display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:0 36px; z-index:5; }
  #outrobrand{ font-weight:900; font-size:26px; letter-spacing:1px; }
  #outrotag{ font-size:13px; color:rgba(245,244,250,.65); margin-top:10px; max-width:270px; }
  #outrocta{
    margin-top:24px; font-weight:700; font-size:13.5px;
    background:linear-gradient(90deg,#7c5cff,#ff6bd6); color:#fff;
    padding:11px 24px; border-radius:24px;
  }

  /* prototype chrome */
  #chrome{ width:var(--stage-w); }
  #timeline{ position:relative; height:34px; border-radius:8px; overflow:hidden; display:flex; cursor:pointer; background:#000; }
  .tlseg{ position:relative; display:flex; align-items:center; justify-content:center; font-size:9.5px; color:rgba(255,255,255,.75); font-weight:600; border-right:1px solid rgba(0,0,0,.4); }
  #playhead{ position:absolute; top:0; bottom:0; width:2px; background:#fff; box-shadow:0 0 6px #fff; pointer-events:none; }
  #transportrow{ display:flex; align-items:center; justify-content:space-between; margin-top:8px; font-size:11px; color:#888; }
  #playpausebtn{ background:#2a2a2a; color:#fff; border:none; border-radius:6px; padding:5px 12px; font-size:11px; cursor:pointer; font-weight:600; }
  #timecode{ font-variant-numeric:tabular-nums; }
  #chromenote{ font-size:10.5px; color:#666; margin-top:10px; line-height:1.5; text-align:center; }
</style>
</head>
<body>

<div id="stage">
  <div id="aurora"></div>
  <div id="noise"></div>

  <div class="scene" id="scene-hook">
    <div class="masklinewrap"><div class="maskline" id="hookline1">Thiết kế đẹp.</div></div>
    <div class="masklinewrap"><div class="maskline" id="hookline2">Chuyển động mượt.</div></div>
  </div>

  <div class="scene" id="scene-bento">
    <div id="bentotitle">TẠI SAO CHỌN AURA</div>
    <div id="bentogrid">
      <div class="bcard" id="card-stat"><div class="big" id="statval">0%</div><div class="lbl"></div></div>
      <div class="bcard" id="card-f1"><div class="ic">⚡</div><div class="t"></div></div>
      <div class="bcard" id="card-f2"><div class="ic">🎨</div></div>
      <div class="bcard" id="card-chart"><svg id="chartsvg" viewBox="0 0 100 34"></svg></div>
      <div class="bcard" id="card-quote"><div class="q" id="quotetext"></div><div class="a" id="quoteauthor"></div></div>
      <div class="bcard" id="card-palette"><div class="swrow" id="swatchrow"></div></div>
    </div>
  </div>

  <div class="scene" id="scene-outro">
    <div id="outrobrand"></div>
    <div id="outrotag"></div>
    <div id="outrocta"></div>
  </div>
</div>

<div id="chrome">
  <div id="timeline"></div>
  <div id="transportrow">
    <button id="playpausebtn">⏸ Pause</button>
    <span id="timecode">0.00s / 0.00s</span>
  </div>
  <div id="chromenote">
    Thẻ số liệu lớn (trái trên) sẽ tự "phóng to lấy trọng tâm" giữa
    scene bento — thử tua vào khoảng 60-75% thanh thời gian để thấy.
  </div>
</div>

<script>
/* ================================================================
   1) DATA — nội dung, tách khỏi thiết kế/animation.
   ================================================================ */
const DATA = {
  hook: { line1:"Thiết kế đẹp.", line2:"Chuyển động mượt." },
  bento: {
    stat: { value:98, suffix:"%", label:"khách hàng hài lòng sau 30 ngày" },
    feature1: { icon:"⚡", title:"Tải trang dưới 100ms" },
    feature2: { icon:"🎨" },
    chart: { points:[3,5,4,7,9,8,12,10,14] },
    quote: { text:"Sản phẩm đẹp và mượt nhất tôi từng dùng trong năm nay.", author:"— Chị Mai, Product Designer" },
    palette: ["#7c5cff","#ff6bd6","#3ddcff","#ffb84d"],
  },
  outro: { brand:"AURA", tagline:"Thiết kế cho những ai để ý từng chi tiết nhỏ.", cta:"Khám phá ngay →" }
};

/* ================================================================
   2) THEME — design tokens + cấu hình aurora nền, tách khỏi DATA.
   ================================================================ */
const THEME = {
  color: { bg:"#06050a", textPrimary:"#f5f4fa", textSecondary:"rgba(245,244,250,.65)" },
  auroraBlobs: [
    { color:"#7c5cff", size:220, ax:26, ay:18, freqx:0.008, freqy:0.011, phase:0,   baseX:20, baseY:22 },
    { color:"#ff6bd6", size:200, ax:20, ay:24, freqx:0.010, freqy:0.007, phase:2.1, baseX:75, baseY:30 },
    { color:"#3ddcff", size:180, ax:22, ay:20, freqx:0.006, freqy:0.013, phase:4.0, baseX:30, baseY:78 },
    { color:"#ffb84d", size:160, ax:18, ay:16, freqx:0.012, freqy:0.009, phase:1.2, baseX:80, baseY:80 },
  ],
};

/* ================================================================
   3) TIMING / CONFIG
   ================================================================ */
const TIMING = { fps:30, sceneFadeFrames:14 };
const CONFIG = {
  fps: TIMING.fps, width:1080, height:1920,
  scenes: [
    { id:"hook",  durationInFrames:60  }, // 2.0s
    { id:"bento", durationInFrames:210 }, // 7.0s
    { id:"outro", durationInFrames:70  }, // 2.3s
  ]
};
let cursor = 0;
CONFIG.scenes.forEach(s=>{ s.startFrame = cursor; cursor += s.durationInFrames; });
const TOTAL_FRAMES = cursor;

/* ================================================================
   4) ENGINE — pure per-frame.
   ================================================================ */
function clamp(v,a,b){ return Math.min(b,Math.max(a,v)); }
function interpolate(frame,[i0,i1],[o0,o1],easing=t=>t){
  const t = clamp((frame-i0)/(i1-i0),0,1);
  return o0 + (o1-o0)*easing(t);
}
const easeOutCubic = t=>1-Math.pow(1-t,3);
const easeOutExpo = t=> t===1?1:1-Math.pow(2,-10*t);
const easeOutBack = t=>{ const c1=1.70158,c3=c1+1; return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2); };

function sceneOpacity(localFrame,dur){
  const f = TIMING.sceneFadeFrames;
  return interpolate(localFrame,[0,f],[0,1]) * interpolate(localFrame,[dur-f,dur],[1,0]);
}

/* ---- aurora background: vị trí từng blob là hàm sin/cos thuần của frame ---- */
const auroraEl = document.getElementById('aurora');
THEME.auroraBlobs.forEach((b,i)=>{
  const el = document.createElement('div');
  el.className = 'blob'; el.id = 'blob-'+i;
  el.style.width = b.size+'px'; el.style.height = b.size+'px';
  el.style.background = b.color;
  auroraEl.appendChild(el);
});
function renderAurora(frame){
  THEME.auroraBlobs.forEach((b,i)=>{
    const t = frame;
    const x = b.baseX + b.ax*Math.sin(t*b.freqx + b.phase);
    const y = b.baseY + b.ay*Math.cos(t*b.freqy + b.phase);
    const el = document.getElementById('blob-'+i);
    el.style.left = `calc(${x}% - ${b.size/2}px)`;
    el.style.top = `calc(${y}% - ${b.size/2}px)`;
  });
}

/* ---- scene: hook (mask-reveal kinetic type) ---- */
document.getElementById('hookline1').textContent = DATA.hook.line1;
document.getElementById('hookline2').textContent = DATA.hook.line2;
function renderHook(localFrame,dur){
  document.getElementById('scene-hook').style.opacity = sceneOpacity(localFrame,dur);
  const l1 = document.getElementById('hookline1');
  const l2 = document.getElementById('hookline2');
  l1.style.transform = `translateY(${interpolate(localFrame,[0,20],[110,0],easeOutExpo)}%)`;
  l2.style.transform = `translateY(${interpolate(localFrame,[10,32],[110,0],easeOutExpo)}%)`;
}

/* ---- scene: bento grid ---- */
document.querySelector('#card-stat .lbl').textContent = DATA.bento.stat.label;
document.querySelector('#card-f1 .t').textContent = DATA.bento.feature1.title;
document.getElementById('quotetext').textContent = '"'+DATA.bento.quote.text+'"';
document.getElementById('quoteauthor').textContent = DATA.bento.quote.author;
const swatchrowEl = document.getElementById('swatchrow');
DATA.bento.palette.forEach(c=>{
  const sw = document.createElement('div'); sw.className='sw'; sw.style.background=c;
  swatchrowEl.appendChild(sw);
});

// vẽ chart 1 lần từ DATA (deterministic path, không đổi giữa các frame)
const chartPts = DATA.bento.chart.points;
const cMax = Math.max(...chartPts), cMin = Math.min(...chartPts);
const chartCoords = chartPts.map((v,i)=>{
  const x = (i/(chartPts.length-1))*100;
  const y = 30 - ((v-cMin)/(cMax-cMin))*26;
  return [x,y];
});
const chartLinePath = chartCoords.map((c,i)=>(i===0?'M':'L')+c[0].toFixed(1)+','+c[1].toFixed(1)).join(' ');
document.getElementById('chartsvg').innerHTML = `<path id="chartline" d="${chartLinePath}" fill="none" stroke="#3ddcff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>`;
const chartLineEl = document.getElementById('chartline');
const chartLen = chartLineEl.getTotalLength();
chartLineEl.style.strokeDasharray = chartLen;

const CARD_IDS = ['card-stat','card-f1','card-f2','card-chart','card-quote','card-palette'];
const HERO_ZOOM_START = 130, HERO_ZOOM_HOLD = 155, HERO_ZOOM_BACK = 180, HERO_ZOOM_END = 200;

function renderBento(localFrame,dur){
  document.getElementById('scene-bento').style.opacity = sceneOpacity(localFrame,dur);
  document.getElementById('bentotitle').style.opacity = interpolate(localFrame,[0,12],[0,1]);

  CARD_IDS.forEach((id,i)=>{
    const start = 10 + i*10;
    const el = document.getElementById(id);
    const reveal = interpolate(localFrame,[start,start+18],[0,1],easeOutBack);
    const fade = interpolate(localFrame,[start,start+14],[0,1]);
    el.style.opacity = fade;
    let scale = Math.max(0, reveal);
    let rotate = interpolate(localFrame,[start,start+18],[-2.5,0]);
    let z = 1;

    // "hero zoom" trên thẻ số liệu để tạo điểm nhấn trọng tâm giữa scene
    if(id==='card-stat'){
      const zoomIn = interpolate(localFrame,[HERO_ZOOM_START,HERO_ZOOM_HOLD],[1,1.12],easeOutCubic);
      const zoomOut = interpolate(localFrame,[HERO_ZOOM_BACK,HERO_ZOOM_END],[1.12,1],easeOutCubic);
      const heroScale = localFrame<HERO_ZOOM_HOLD ? zoomIn : (localFrame<HERO_ZOOM_BACK ? 1.12 : zoomOut);
      scale = scale * (localFrame>=HERO_ZOOM_START ? heroScale : 1);
      z = (localFrame>=HERO_ZOOM_START && localFrame<HERO_ZOOM_END) ? 5 : 1;
      el.style.boxShadow = localFrame>=HERO_ZOOM_START && localFrame<HERO_ZOOM_END
        ? '0 20px 50px rgba(124,92,255,.4), inset 0 1px 0 rgba(255,255,255,.2)'
        : 'inset 0 1px 0 rgba(255,255,255,.12), 0 10px 24px rgba(0,0,0,.3)';
    }
    el.style.transform = `scale(${scale}) rotate(${rotate}deg)`;
    el.style.zIndex = z;
  });

  const statProgress = interpolate(localFrame,[16,40],[0,DATA.bento.stat.value],easeOutCubic);
  document.getElementById('statval').textContent = Math.round(statProgress)+DATA.bento.stat.suffix;

  const chartStart = 46, chartDrawDur = 40;
  const chartReveal = interpolate(localFrame,[chartStart,chartStart+chartDrawDur],[0,1],easeOutCubic);
  chartLineEl.style.strokeDashoffset = chartLen*(1-chartReveal);
}

/* ---- scene: outro ---- */
document.getElementById('outrobrand').textContent = DATA.outro.brand;
document.getElementById('outrotag').textContent = DATA.outro.tagline;
document.getElementById('outrocta').textContent = DATA.outro.cta;
function renderOutro(localFrame,dur){
  document.getElementById('scene-outro').style.opacity = sceneOpacity(localFrame,dur);
  document.getElementById('outrobrand').style.transform = `scale(${interpolate(localFrame,[0,18],[0.75,1],easeOutBack)})`;
  document.getElementById('outrotag').style.opacity = interpolate(localFrame,[16,28],[0,1]);
  const ctaEl = document.getElementById('outrocta');
  ctaEl.style.opacity = interpolate(localFrame,[30,42],[0,1]);
  ctaEl.style.transform = localFrame>44 ? `scale(${1+0.03*Math.sin(localFrame*0.15)})` : 'scale(1)';
}

const RENDERERS = { hook:renderHook, bento:renderBento, outro:renderOutro };
function renderFrame(frame){
  renderAurora(frame);
  CONFIG.scenes.forEach(s=>{
    const local = frame - s.startFrame;
    if(local>=0 && local<s.durationInFrames){ RENDERERS[s.id](local, s.durationInFrames); }
    else{ document.getElementById('scene-'+s.id).style.opacity = 0; }
  });
}

/* ================================================================
   5) PROTOTYPE PLAYBACK
   ================================================================ */
const timelineEl = document.getElementById('timeline');
const playheadEl = document.createElement('div');
playheadEl.id = 'playhead';
timelineEl.appendChild(playheadEl);
CONFIG.scenes.forEach((s,i)=>{
  const seg = document.createElement('div');
  seg.className = 'tlseg';
  seg.style.flex = s.durationInFrames;
  seg.style.background = ['#241c3a','#1c1830','#241c3a'][i];
  seg.textContent = s.id;
  timelineEl.insertBefore(seg, playheadEl);
});

let isPlaying = true, playStartPerf = performance.now(), seekFrame = 0;
function currentFrame(){ return isPlaying ? Math.floor(((performance.now()-playStartPerf)/1000)*CONFIG.fps) : seekFrame; }
function updateChrome(frame){
  playheadEl.style.left = (clamp(frame/TOTAL_FRAMES,0,1)*100)+'%';
  document.getElementById('timecode').textContent = `${(frame/CONFIG.fps).toFixed(2)}s / ${(TOTAL_FRAMES/CONFIG.fps).toFixed(2)}s`;
}
function loop(){
  let frame = currentFrame();
  if(isPlaying && frame>=TOTAL_FRAMES){ playStartPerf = performance.now(); frame = 0; }
  renderFrame(frame); updateChrome(frame);
  requestAnimationFrame(loop);
}
loop();
document.getElementById('playpausebtn').addEventListener('click', ()=>{
  if(isPlaying){ seekFrame = currentFrame(); isPlaying=false; document.getElementById('playpausebtn').textContent='▶ Play'; }
  else{ playStartPerf = performance.now() - (seekFrame/CONFIG.fps)*1000; isPlaying=true; document.getElementById('playpausebtn').textContent='⏸ Pause'; }
});
timelineEl.addEventListener('click', e=>{
  const rect = timelineEl.getBoundingClientRect();
  const frame = Math.floor(clamp((e.clientX-rect.left)/rect.width,0,1)*TOTAL_FRAMES);
  seekFrame = frame; isPlaying = false;
  document.getElementById('playpausebtn').textContent = '▶ Play';
  renderFrame(frame); updateChrome(frame);
});
</script>

<!--
================================================================
TEMPLATE PROTOTYPE

Name: Bento Grid Showcase
Description: Video giới thiệu sản phẩm/thương hiệu theo 2 trend frontend
  mạnh nhất hiện nay: Bento Grid layout (lưới bất đối xứng nhiều kích
  cỡ thẻ, kiểu Apple/Linear feature page) và Aurora gradient mesh nền
  + glassmorphism (nhiều khối màu blur di chuyển mượt qua lại kiểu
  Linear.app). Tiêu đề mở đầu dùng kỹ thuật mask-reveal (chữ trượt ra
  từ dưới khung bị che, không phải fade đơn thuần) — thủ pháp kinetic
  typography cao cấp. Có 1 khoảnh khắc "hero zoom": thẻ số liệu lớn
  tự phóng to lấy trọng tâm giữa scene rồi thu về, mô phỏng cách các
  video keynote dẫn mắt người xem.

Recommended aspect ratio: 9:16 (1080x1920)
Recommended duration: 11.3s @ 30fps (340 frames)

Scenes:
- Scene 1 — Hook (2.0s): 2 dòng tiêu đề trượt lên từ khung bị che
  (overflow:hidden + translateY), dòng 2 có gradient chữ.
- Scene 2 — Bento (7.0s): 6 thẻ kính mờ (stat lớn, feature icon x2,
  mini chart tự vẽ path, quote, bảng màu) hiện lần lượt so le kiểu
  easeOutBack (scale+rotate nhẹ "nảy vào chỗ"); ở giữa scene, thẻ số
  liệu lớn phóng to 12% + đổ bóng màu để lấy trọng tâm rồi thu lại.
- Scene 3 — Outro (2.3s): brand pop-in, tagline, CTA gradient pulse.
- Toàn video: nền aurora — 4 khối màu blur di chuyển theo quỹ đạo
  sin/cos riêng (biên độ, tần số, pha khác nhau từng khối), hoà trộn
  bằng mix-blend-mode:screen, hoàn toàn xác định theo frame.

Configurable content:
- DATA.hook.{line1,line2}
- DATA.bento.stat.{value,suffix,label}
- DATA.bento.feature1.{icon,title} / feature2.icon
- DATA.bento.chart.points[] — số điểm tự do, path tự tính lại
- DATA.bento.quote.{text,author}
- DATA.bento.palette[] (mã màu hex, số lượng tự do)
- DATA.outro.{brand,tagline,cta}
- THEME.color.* / THEME.auroraBlobs[] (màu, kích cỡ, biên độ, tần số,
  pha, vị trí gốc của từng khối gradient — đổi để có "tính khí" nền
  khác hẳn mà không đụng logic renderAurora())

Assets:
- Chỉ Google Font 'Inter' + 'JetBrains Mono'. Toàn bộ hiệu ứng (aurora,
  glass, chart, mask-reveal) dựng bằng CSS/SVG thuần, không ảnh ngoài.

Prototype-only behavior:
- Auto-loop khi hết video, timeline/scrubber/play-pause là chrome xem
  trước, nằm ngoài #stage, không thuộc render.
- chartLineEl.getTotalLength() gọi 1 lần lúc dựng DOM — API trình
  duyệt, hoạt động y hệt trong Chromium headless của Remotion.

Remotion migration considerations:
- renderAurora(frame) là hàm thuần tuý theo frame — map thẳng sang
  component <AuroraBackground currentFrame={frame}/>, giữ nguyên công
  thức sin/cos, không cần Math.random nên không lo vấn đề seed.
- mask-reveal ở scene hook dùng overflow:hidden + translateY% — kỹ
  thuật CSS chuẩn, Remotion hỗ trợ nguyên vẹn.
- "Hero zoom" trên card-stat hiện đang if/else theo id trong vòng
