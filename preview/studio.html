<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Creative Studio</title>
  <style>
:root{--bg:#0a0e1a;--panel:#0f1423;--surface:#141a2e;--line:rgba(255,255,255,0.08);--accent1:#00d4ff;--accent2:#d4a843;--accent3:#34d399;--ink:#e8e6e1;--muted:#6b7280;--radius:10px}*{box-sizing:border-box;margin:0;padding:0}html,body,#root{height:100%;background:var(--bg);color:var(--ink);font-family:"Inter","Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}body{display:flex;flex-direction:column}header{height:48px;padding:0 16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line);background:var(--panel);flex-shrink:0}.brand{font-weight:800;font-size:14px;color:var(--accent1);white-space:nowrap}.brand span{color:var(--muted);font-weight:400;margin-left:6px;font-size:12px}.hsep{width:1px;height:24px;background:var(--line);flex-shrink:0}.prod-select{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:4px 8px;font-size:12px;font-weight:500;cursor:pointer;outline:none;max-width:200px}.prod-select:focus{border-color:var(--accent1)}.template-badge{font-size:11px;font-weight:600;color:var(--accent2);background:rgba(212,168,67,0.1);padding:3px 8px;border-radius:4px;border:1px solid rgba(212,168,67,0.2)}.spacer{flex:1}.format-btn{background:var(--surface);color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:3px 8px;font-size:11px;font-weight:600;cursor:pointer;transition:all 0.15s}.format-btn:hover:not(.disabled){color:var(--ink);border-color:var(--accent1)}.format-btn.active{color:var(--accent1);border-color:var(--accent1);background:rgba(0,212,255,0.08)}.format-btn.disabled{opacity:0.35;cursor:not-allowed}.chip{font-size:11px;font-variant-numeric:tabular-nums;color:var(--muted);background:var(--surface);padding:3px 8px;border-radius:5px;border:1px solid var(--line)}.toggle-btn{background:var(--surface);color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:3px 8px;font-size:11px;font-weight:600;cursor:pointer;transition:all 0.15s}.toggle-btn:hover{color:var(--ink);border-color:var(--accent1)}.toggle-btn.active{color:var(--accent3);border-color:var(--accent3);background:rgba(52,211,153,0.08)}.main{flex:1;display:flex;overflow:hidden}.sidebar{width:200px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;flex-shrink:0}.sidebar-section{padding:10px 12px 6px}.sidebar-label{font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin-bottom:6px}.scene-list{flex:1;overflow-y:auto;padding:0 6px 6px}.scene-btn{width:100%;text-align:left;padding:8px 10px;border:1px solid transparent;background:transparent;color:var(--muted);border-radius:6px;cursor:pointer;font-size:12px;font-weight:500;transition:all 0.15s;margin-bottom:1px;position:relative}.scene-btn:hover{background:var(--surface);color:var(--ink)}.scene-btn.active{background:var(--surface);border-color:var(--accent1);color:var(--ink)}.scene-meta{display:flex;align-items:center;gap:6px;margin-top:2px}.scene-kind{font-size:9px;font-weight:600;letter-spacing:0.8px;text-transform:uppercase;color:var(--accent1);opacity:0.7}.scene-dur{font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums}.scene-progress{position:absolute;bottom:0;left:6px;right:6px;height:2px;background:var(--surface);border-radius:1px;overflow:hidden}.scene-progress-fill{height:100%;background:var(--accent1);border-radius:1px;transition:width 0.1s}.canvas-area{flex:1;display:flex;align-items:center;justify-content:center;padding:16px;background:radial-gradient(ellipse at center,#0f1525 0%,var(--bg) 70%);position:relative}.canvas-frame{position:relative;background:#000;border-radius:var(--radius);overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,0.5),0 0 0 1px var(--line)}.canvas-frame .scene-root{position:absolute;inset:0}.canvas-info{position:absolute;top:12px;right:12px;display:flex;gap:6px;z-index:10}.safe-area{position:absolute;border:1px dashed rgba(255,255,255,0.15);pointer-events:none;z-index:5}.safe-area-inner{position:absolute;inset:5%;border:1px dashed rgba(255,255,255,0.08)}.transport{height:64px;background:var(--panel);border-top:1px solid var(--line);display:flex;align-items:center;padding:0 16px;gap:10px;flex-shrink:0}.transport-btn{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--muted);font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.15s;flex-shrink:0}.transport-btn:hover:not(:disabled){color:var(--ink);border-color:var(--accent1)}.transport-btn.play-btn{width:36px;height:36px;border-color:var(--accent1);color:var(--accent1);font-size:14px}.transport-btn.play-btn:hover{background:var(--accent1);color:var(--bg)}.transport-btn:disabled{opacity:0.3;cursor:not-allowed}.scrub-container{flex:1;display:flex;flex-direction:column;gap:3px}.scrub-track{width:100%;height:5px;-webkit-appearance:none;appearance:none;background:var(--surface);border-radius:3px;outline:none;cursor:pointer}.scrub-track::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:var(--accent1);cursor:grab;box-shadow:0 0 6px rgba(0,212,255,0.4)}.scrub-track::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:var(--accent1);border:none;cursor:grab}.scrub-labels{display:flex;justify-content:space-between;font-size:10px;font-variant-numeric:tabular-nums;color:var(--muted)}.time-display{font-size:13px;font-variant-numeric:tabular-nums;color:var(--ink);min-width:100px;text-align:right;flex-shrink:0}.frame-badge{font-size:11px;font-variant-numeric:tabular-nums;color:var(--accent2);background:var(--surface);padding:3px 8px;border-radius:4px;border:1px solid var(--line);flex-shrink:0}.progress-badge{font-size:11px;font-variant-numeric:tabular-nums;color:var(--accent3);background:var(--surface);padding:3px 8px;border-radius:4px;border:1px solid var(--line);flex-shrink:0}.fps-badge{font-size:10px;font-variant-numeric:tabular-nums;color:var(--muted);background:var(--surface);padding:3px 6px;border-radius:4px;border:1px solid var(--line);flex-shrink:0}
  </style>
</head>
<body>
  <header>
    <div class="brand">Creative Studio<span>Preview</span></div>
    <div class="hsep"></div>
    <select id="prod-select" class="prod-select"></select>
    <div id="template-badge" class="template-badge"></div>
    <div class="spacer"></div>
    <div id="format-btns"></div>
    <div class="hsep"></div>
    <div class="chip" id="res-chip">1920 x 1080</div>
    <div class="chip">30 FPS</div>
    <div class="hsep"></div>
    <button id="safe-toggle" class="toggle-btn" title="Toggle safe area overlay">Safe</button>
  </header>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script type="text/babel" src="studio.jsx"></script>
</body>
</html>
