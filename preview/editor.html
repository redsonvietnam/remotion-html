<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Video Editor</title>
  <style>
:root{--bg:#0a0e1a;--panel:#0f1423;--surface:#141a2e;--line:rgba(255,255,255,0.08);--accent1:#00d4ff;--accent2:#d4a843;--accent3:#34d399;--ink:#e8e6e1;--muted:#6b7280;--radius:8px;--danger:#ef4444}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:"Inter","Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{display:flex;flex-direction:column;height:100vh;overflow:hidden}
header{height:48px;padding:0 16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line);background:var(--panel);flex-shrink:0}
.brand{font-weight:800;font-size:14px;color:var(--accent1);white-space:nowrap;cursor:pointer}
.brand span{color:var(--muted);font-weight:400;margin-left:6px;font-size:12px}
.hsep{width:1px;height:24px;background:var(--line);flex-shrink:0}
.spacer{flex:1}
.name-input{background:transparent;border:1px solid transparent;color:var(--ink);font-size:14px;font-weight:600;padding:4px 8px;border-radius:4px;outline:none;width:220px}
.name-input:hover{border-color:var(--line)}
.name-input:focus{border-color:var(--accent1);background:var(--surface)}
.badge{font-size:11px;font-weight:600;padding:3px 8px;border-radius:4px;letter-spacing:0.3px}
.tpl-badge{color:var(--accent2);background:rgba(212,168,67,0.1);border:1px solid rgba(212,168,67,0.2)}
.fmt-badge{color:var(--accent1);background:rgba(0,212,255,0.1);border:1px solid rgba(0,212,255,0.2)}
.save-btn{background:var(--accent1);color:#0a0e1a;border:none;padding:6px 16px;border-radius:6px;font-size:12px;font-weight:700;cursor:pointer;transition:background 0.15s}
.save-btn:hover{background:#00bfe6}
.link-btn{color:var(--muted);text-decoration:none;font-size:12px;font-weight:500;padding:5px 10px;border:1px solid var(--line);border-radius:6px;transition:all 0.15s}
.link-btn:hover{color:var(--accent1);border-color:var(--accent1)}
.main{flex:1;display:flex;overflow:hidden}
.preview-area{flex:1;display:flex;align-items:center;justify-content:center;background:#050508;position:relative;min-width:0}
.preview-frame{position:relative;background:#000;border-radius:8px;overflow:hidden;box-shadow:0 8px 40px rgba(0,0,0,0.6)}
.preview-placeholder{display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--muted);gap:12px;text-align:center;padding:20px}
.preview-placeholder .kind{font-size:14px;font-weight:700;color:var(--ink);text-transform:uppercase;letter-spacing:2px}
.preview-placeholder .sub{font-size:12px;max-width:260px;line-height:1.5}
.preview-placeholder .hint{font-size:11px;color:var(--accent1);margin-top:8px}
.sidebar{width:320px;border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;overflow:hidden;flex-shrink:0}
.sidebar-header{padding:12px 16px;border-bottom:1px solid var(--line);font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
.sidebar-scroll{flex:1;overflow-y:auto;padding:16px}
.field-group{margin-bottom:20px}
.field-label{font-size:11px;font-weight:600;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:0.5px}
.field-input{width:100%;padding:8px 12px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:13px;font-weight:500;outline:none;transition:border-color 0.15s;font-family:inherit}
.field-input:focus{border-color:var(--accent1)}
.field-input-num{width:100%;padding:8px 12px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:13px;font-weight:500;outline:none;transition:border-color 0.15s}
.field-input-num:focus{border-color:var(--accent1)}
.field-hint{font-size:10px;color:var(--muted);margin-top:4px}
.timeline{height:100px;border-top:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;flex-shrink:0}
.timeline-header{display:flex;align-items:center;padding:8px 16px;gap:8px;border-bottom:1px solid var(--line)}
.timeline-label{font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
.timeline-add{background:var(--surface);color:var(--accent1);border:1px dashed rgba(0,212,255,0.3);padding:4px 10px;border-radius:4px;font-size:11px;font-weight:600;cursor:pointer;transition:all 0.15s}
.timeline-add:hover{background:rgba(0,212,255,0.05);border-color:var(--accent1)}
.timeline-scroll{flex:1;display:flex;gap:8px;padding:8px 16px;overflow-x:auto;align-items:flex-start}
.scene-card{min-width:100px;max-width:140px;padding:8px 12px;border-radius:6px;border:1px solid var(--line);background:var(--surface);cursor:pointer;transition:all 0.12s;flex-shrink:0;position:relative}
.scene-card:hover{border-color:rgba(255,255,255,0.15)}
.scene-card.active{border-color:var(--accent1);background:rgba(0,212,255,0.06)}
.scene-card-id{font-size:10px;font-weight:700;color:var(--muted);margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.scene-card-kind{font-size:11px;font-weight:600;color:var(--ink);margin-bottom:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.scene-card-dur{font-size:10px;color:var(--accent1);font-variant-numeric:tabular-nums}
.scene-card-actions{position:absolute;top:4px;right:4px;display:none;gap:2px}
.scene-card.active .scene-card-actions{display:flex}
.scene-action{width:18px;height:18px;border-radius:3px;border:none;background:rgba(255,255,255,0.08);color:var(--muted);font-size:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.12s}
.scene-action:hover{background:rgba(255,255,255,0.15);color:var(--ink)}
.scene-action.danger:hover{background:rgba(239,68,68,0.2);color:var(--danger)}
.no-scenes{padding:20px;color:var(--muted);font-size:12px;text-align:center}
.error-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.8);display:flex;align-items:center;justify-content:center;z-index:100}
.error-box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:40px;max-width:400px;text-align:center}
.error-box h2{font-size:18px;margin-bottom:8px}
.error-box p{font-size:13px;color:var(--muted);margin-bottom:20px;line-height:1.5}
.error-box .btn{padding:10px 24px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;border:none;text-decoration:none;display:inline-block}
.error-box .btn-primary{background:var(--accent1);color:#0a0e1a}
.toast{position:fixed;bottom:20px;right:20px;background:var(--accent3);color:#0a0e1a;padding:10px 20px;border-radius:8px;font-size:13px;font-weight:600;z-index:200;animation:fadeInOut 2s ease forwards}
@keyframes fadeInOut{0%{opacity:0;transform:translateY(10px)}10%{opacity:1;transform:translateY(0)}80%{opacity:1}100%{opacity:0}}
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script type="text/babel">
const { useState, useEffect, useRef, useCallback, useMemo } = React;

// ─── Template Registry ──────────────────────────────────────────────────────
const TEMPLATES = [
  { id:"scrapbook", name:"Scrapbook", status:"ready", formats:["16:9","9:16"],
    sceneKinds:["hero","match","history","photo","timeline","closing"],
    fields:{
      hero:{title:"Title",subtitle:"Subtitle",tagline:"Tagline"},
      match:{homeTeam:"Home Team",awayTeam:"Away Team",score:"Score",competition:"Competition",highlight:"Highlight"},
      history:{year:"Year",fact:"Fact",detail:"Detail",annotation:"Annotation"},
      photo:{caption:"Caption",annotation:"Annotation"},
      timeline:{title:"Title"},
      closing:{title:"Title",subtitle:"Subtitle",reference:"Reference"},
    }},
  { id:"cr7", name:"CR7", status:"ready", formats:["16:9","9:16"],
    sceneKinds:["hero","stat","milestone","closing"],
    fields:{
      hero:{name:"Name",tagline:"Tagline",subtitle:"Subtitle"},
      stat:{label:"Label",bigNumber:"Big Number",sub:"Sub",detail:"Detail"},
      milestone:{title:"Title"},
      closing:{title:"Title",subtitle:"Subtitle",reference:"Reference"},
    }},
  { id:"cosmos", name:"Cosmos", status:"ready", formats:["16:9","9:16"],
    sceneKinds:["title","fact","compare","timeline","diagram","closing"],
    fields:{
      title:{title:"Title",subtitle:"Subtitle",tagline:"Tagline"},
      fact:{label:"Label",bigValue:"Big Value",unit:"Unit",description:"Description",detail:"Detail"},
      compare:{title:"Title",insight:"Insight"},
      timeline:{title:"Title"},
      diagram:{title:"Title"},
      closing:{title:"Title",subtitle:"Subtitle",reference:"Reference"},
    }},
  { id:"nodeflow", name:"NodeFlow", status:"ready", formats:["16:9"],
    sceneKinds:["title","flow","contribution","benefit","compare","end"],
    fields:{
      title:{lawCode:"Law Code",title:"Title",subtitle:"Subtitle",tagline:"Tagline"},
      flow:{title:"Title"},
      contribution:{title:"Title"},
      benefit:{title:"Title",description:"Description"},
      compare:{title:"Title"},
      end:{closingTitle:"Title",closingSubtitle:"Subtitle",reference:"Reference"},
    }},
];

// ─── Template Themes ────────────────────────────────────────────────────────

const EDITABLE_IDS = TEMPLATES.map(t => t.id);
const LEGACY_IDS = ["nq57","stoiclove","blueprint"];
const STORAGE_KEY = "nf_editor_projects";
const CURRENT_KEY = "nf_editor_current";

// ─── Default scenes per template ────────────────────────────────────────────
function defaultScenes(templateId) {
  const t = TEMPLATES.find(x => x.id === templateId);
  if (!t) return [];
  const kinds = t.sceneKinds;
  return kinds.map((kind, i) => {
    const content = {};
    const f = t.fields[kind] || {};
    for (const [k, label] of Object.entries(f)) {
      content[k] = "";
    }
    return { id: "s" + (i + 1), kind, dur: 5, content };
  });
}

// ─── localStorage persistence ───────────────────────────────────────────────
function loadProjects() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}"); } catch { return {}; }
}
function saveProjects(projects) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(projects));
}
function loadCurrentId() {
  try { return localStorage.getItem(CURRENT_KEY) || null; } catch { return null; }
}
function saveCurrentId(id) {
  if (id) localStorage.setItem(CURRENT_KEY, id);
  else localStorage.removeItem(CURRENT_KEY);
}

// ─── URL params ─────────────────────────────────────────────────────────────
function getUrlParam(name) {
  try { return new URLSearchParams(window.location.search).get(name); } catch { return null; }
}

function uid() { return "p" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

// ─── Editor App ─────────────────────────────────────────────────────────────
function App() {
  const projectIdFromUrl = getUrlParam("project");
  const templateIdFromUrl = getUrlParam("template");
  const formatFromUrl = getUrlParam("format") || "16:9";
  const nameFromUrl = getUrlParam("name") || "";

  // Try to load existing project or create new one
  const [project, setProject] = useState(() => {
    // If we have a project ID, try to load it
    if (projectIdFromUrl) {
      const projects = loadProjects();
      if (projects[projectIdFromUrl]) {
        saveCurrentId(projectIdFromUrl);
        return projects[projectIdFromUrl];
      }
    }
    // If we have template info, create a new project
    if (templateIdFromUrl) {
      const tpl = TEMPLATES.find(t => t.id === templateIdFromUrl);
      if (tpl && tpl.status === "ready") {
        const newProject = {
          id: uid(),
          name: nameFromUrl || ("Untitled " + tpl.name + " Video"),
          templateId: templateIdFromUrl,
          format: tpl.formats.includes(formatFromUrl) ? formatFromUrl : tpl.formats[0],
          scenes: defaultScenes(templateIdFromUrl),
          createdAt: new Date().toISOString(),
          updatedAt: new Date().toISOString(),
        };
        saveCurrentId(newProject.id);
        return newProject;
      }
    }
    // No valid params — error state
    return null;
  });

  const [selectedSceneIdx, setSelectedSceneIdx] = useState(0);
  const [toast, setToast] = useState(null);

  // Save project to localStorage whenever it changes
  useEffect(() => {
    if (!project) return;
    const projects = loadProjects();
    projects[project.id] = project;
    saveProjects(projects);
    saveCurrentId(project.id);
  }, [project]);

  // Update URL to reflect project
  useEffect(() => {
    if (!project) return;
    const url = new URL(window.location.href);
    url.searchParams.set("project", project.id);
    window.history.replaceState({}, "", url.toString());
  }, [project?.id]);

  const showToast = useCallback((msg) => {
    setToast(msg);
    setTimeout(() => setToast(null), 2000);
  }, []);

  const updateScene = useCallback((idx, updater) => {
    setProject(p => {
      if (!p) return p;
      const scenes = [...p.scenes];
      scenes[idx] = { ...scenes[idx], ...updater(scenes[idx]) };
      return { ...p, scenes, updatedAt: new Date().toISOString() };
    });
  }, []);

  const addScene = useCallback(() => {
    setProject(p => {
      if (!p) return p;
      const tpl = TEMPLATES.find(t => t.id === p.templateId);
      if (!tpl) return p;
      // Add a scene of the first kind
      const kind = tpl.sceneKinds[0];
      const f = tpl.fields[kind] || {};
      const content = {};
      for (const k of Object.keys(f)) content[k] = "";
      const newScene = { id: "s" + (p.scenes.length + 1) + "_" + Date.now().toString(36), kind, dur: 5, content };
      const scenes = [...p.scenes, newScene];
      return { ...p, scenes, updatedAt: new Date().toISOString() };
    });
    showToast("Scene added");
  }, [showToast]);

  const duplicateScene = useCallback((idx) => {
    setProject(p => {
      if (!p) return p;
      const src = p.scenes[idx];
      const dup = { ...src, id: src.id + "_copy_" + Date.now().toString(36), content: { ...src.content } };
      const scenes = [...p.scenes];
      scenes.splice(idx + 1, 0, dup);
      return { ...p, scenes, updatedAt: new Date().toISOString() };
    });
    showToast("Scene duplicated");
  }, [showToast]);

  const deleteScene = useCallback((idx) => {
    setProject(p => {
      if (!p || p.scenes.length <= 1) return p;
      const scenes = p.scenes.filter((_, i) => i !== idx);
      return { ...p, scenes, updatedAt: new Date().toISOString() };
    });
    setSelectedSceneIdx(i => Math.max(0, i - 1));
    showToast("Scene deleted");
  }, [showToast]);

  const moveScene = useCallback((idx, dir) => {
    setProject(p => {
      if (!p) return p;
      const ni = idx + dir;
      if (ni < 0 || ni >= p.scenes.length) return p;
      const scenes = [...p.scenes];
      [scenes[idx], scenes[ni]] = [scenes[ni], scenes[idx]];
      return { ...p, scenes, updatedAt: new Date().toISOString() };
    });
    setSelectedSceneIdx(i => i + dir);
  }, []);

  const updateContent = useCallback((field, value) => {
    updateScene(selectedSceneIdx, (s) => ({
      content: { ...s.content, [field]: value }
    }));
  }, [selectedSceneIdx, updateScene]);

  const updateDuration = useCallback((val) => {
    const dur = parseFloat(val);
    if (isNaN(dur) || dur < 0.5) return;
    updateScene(selectedSceneIdx, () => ({ dur }));
  }, [selectedSceneIdx, updateScene]);

  const updateKind = useCallback((kind) => {
    updateScene(selectedSceneIdx, (s) => {
      const tpl = TEMPLATES.find(t => t.id === project?.templateId);
      if (!tpl || !tpl.sceneKinds.includes(kind)) return s; // reject invalid kind
      const f = tpl.fields[kind] || {};
      const content = {};
      for (const k of Object.keys(f)) {
        content[k] = s.content[k] || "";
      }
      return { kind, content };
    });
  }, [selectedSceneIdx, updateScene, project?.templateId]);

  const handleNameChange = useCallback((e) => {
    setProject(p => p ? { ...p, name: e.target.value, updatedAt: new Date().toISOString() } : p);
  }, []);

  const handleSave = useCallback(() => {
    if (!project) return;
    const projects = loadProjects();
    projects[project.id] = project;
    saveProjects(projects);
    showToast("Project saved");
  }, [project, showToast]);

  // Error state
  if (!project) {
    const msg = projectIdFromUrl
      ? `No project found with id "${projectIdFromUrl}".`
      : templateIdFromUrl
        ? `Template "${templateIdFromUrl}" is not available for editing.`
        : "No project or template specified.";
    return (
      <div className="error-overlay">
        <div className="error-box">
          <h2>Cannot Open Editor</h2>
          <p>{msg}</p>
          <a href="/preview/library.html" className="btn btn-primary">Back to Library</a>
        </div>
      </div>
    );
  }

  const tpl = TEMPLATES.find(t => t.id === project.templateId);
  const scene = project.scenes[selectedSceneIdx];
  const sceneFields = tpl?.fields?.[scene?.kind] || {};
  const canvasW = project.format === "9:16" ? 270 : 480;
  const canvasH = project.format === "9:16" ? 480 : 270;

  return (
    <React.Fragment>
      <Header project={project} onNameChange={handleNameChange} onSave={handleSave} />
      <div className="main">
        <PreviewArea project={project} scene={scene} tpl={tpl} canvasW={canvasW} canvasH={canvasH} />
        <Sidebar scene={scene} sceneFields={sceneFields} tpl={tpl} project={project}
          onContentChange={updateContent} onDurationChange={updateDuration} onKindChange={updateKind} />
      </div>
      <Timeline scenes={project.scenes} selectedIdx={selectedSceneIdx} onSelect={setSelectedSceneIdx}
        onAdd={addScene} onDuplicate={duplicateScene} onDelete={deleteScene} onMove={moveScene} />
      {toast && <div className="toast">{toast}</div>}
    </React.Fragment>
  );
}

function Header({ project, onNameChange, onSave }) {
  const tpl = TEMPLATES.find(t => t.id === project.templateId);
  return (
    <header>
      <div className="brand" onClick={() => window.location.href = "/preview/library.html"}>
        Editor<span>MVP</span>
      </div>
      <div className="hsep"></div>
      <input className="name-input" value={project.name} onChange={onNameChange} placeholder="Project name..." />
      <div className="hsep"></div>
      <span className="badge tpl-badge">{tpl?.name || project.templateId}</span>
      <span className="badge fmt-badge">{project.format}</span>
      <div className="spacer"></div>
      <button className="save-btn" onClick={onSave}>Save</button>
      <a href="/preview/library.html" className="link-btn">Library</a>
    </header>
  );
}

function PreviewArea({ project, scene, tpl, canvasW, canvasH }) {
  if (!scene || !tpl) {
    return <div className="preview-area"><div className="preview-frame" style={{width:canvasW,height:canvasH}}><div className="preview-placeholder"><div className="kind">NO SCENE</div></div></div></div>;
  }
  const th = THEMES[project.templateId] || THEMES.nodeflow;
  const rendererMap = RENDERERS[project.templateId];
  const Renderer = rendererMap?.[scene.kind];
  const W = project.format === "9:16" ? 1080 : 1920;
  const H = project.format === "9:16" ? 1920 : 1080;
  const scale = Math.min(canvasW / W, canvasH / H);

  return (
    <div className="preview-area">
      <div className="preview-frame" style={{ width: canvasW, height: canvasH, overflow: "hidden" }}>
        <div style={{ width: W, height: H, transform: "scale(" + scale + ")", transformOrigin: "top left" }}>
          {Renderer
            ? <Renderer W={W} H={H} d={scene.content} th={th} />
            : <Fallback_Preview W={W} H={H} d={scene.content} th={th} kind={scene.kind} />
          }
        </div>
      </div>
    </div>
  );
}

function Sidebar({ scene, sceneFields, tpl, project, onContentChange, onDurationChange, onKindChange }) {
  if (!scene) {
    return <div className="sidebar"><div className="sidebar-header">Scene Inspector</div><div className="sidebar-scroll"><div className="no-scenes">No scene selected</div></div></div>;
  }
  return (
    <div className="sidebar">
      <div className="sidebar-header">Scene Inspector</div>
      <div className="sidebar-scroll">
        <div className="field-group">
          <div className="field-label">Scene Kind</div>
          <select className="field-input" value={scene.kind} onChange={e => onKindChange(e.target.value)}>
            {(tpl?.sceneKinds || []).map(k => <option key={k} value={k}>{k}</option>)}
          </select>
        </div>
        <div className="field-group">
          <div className="field-label">Duration (seconds)</div>
          <input className="field-input-num" type="number" min="0.5" step="0.5" value={scene.dur}
            onChange={e => onDurationChange(e.target.value)} />
          <div className="field-hint">Minimum 0.5s</div>
        </div>
        {Object.entries(sceneFields).map(([key, label]) => (
          <div className="field-group" key={key}>
            <div className="field-label">{label}</div>
            <input className="field-input" type="text" value={scene.content[key] || ""}
              onChange={e => onContentChange(key, e.target.value)}
              placeholder={"Enter " + label.toLowerCase() + "..."} />
          </div>
        ))}
        {Object.keys(sceneFields).length === 0 && (
          <div className="field-group">
            <div className="field-label">Content</div>
            <div className="field-hint">This scene kind has no editable text fields in the MVP.</div>
          </div>
        )}
      </div>
    </div>
  );
}

function Timeline({ scenes, selectedIdx, onSelect, onAdd, onDuplicate, onDelete, onMove }) {
  const scrollRef = useRef(null);
  useEffect(() => {
    if (scrollRef.current) {
      const card = scrollRef.current.children[selectedIdx];
      if (card) card.scrollIntoView({ behavior: "smooth", block: "nearest", inline: "center" });
    }
  }, [selectedIdx]);
  return (
    <div className="timeline">
      <div className="timeline-header">
        <span className="timeline-label">Scenes ({scenes.length})</span>
        <button className="timeline-add" onClick={onAdd}>+ Add</button>
      </div>
      <div className="timeline-scroll" ref={scrollRef}>
        {scenes.length === 0 && <div className="no-scenes">No scenes. Click + Add to begin.</div>}
        {scenes.map((s, i) => (
          <div key={s.id} className={"scene-card" + (i === selectedIdx ? " active" : "")} onClick={() => onSelect(i)}>
            <div className="scene-card-id">{s.id}</div>
            <div className="scene-card-kind">{s.kind}</div>
            <div className="scene-card-dur">{s.dur.toFixed(1)}s</div>
            <div className="scene-card-actions">
              <button className="scene-action" title="Move left" disabled={i === 0}
                onClick={e => { e.stopPropagation(); onMove(i, -1); }}>&#9664;</button>
              <button className="scene-action" title="Move right" disabled={i === scenes.length - 1}
                onClick={e => { e.stopPropagation(); onMove(i, 1); }}>&#9654;</button>
              <button className="scene-action" title="Duplicate"
                onClick={e => { e.stopPropagation(); onDuplicate(i); }}>&#10697;</button>
              <button className="scene-action danger" title="Delete" disabled={scenes.length <= 1}
                onClick={e => { e.stopPropagation(); onDelete(i); }}>&#10005;</button>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
